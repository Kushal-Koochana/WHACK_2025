[project]
name = "jak-financial-literacy-contract-analyser"
version = "0.1.0"
description = "A full-stack web application combining financial education, personal finance management, and AI-powered contract analysis."
authors = [
    { name = "Joshua Cullen" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask==3.1.2",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.0.36",
    "google-genai==1.45.0",
    "pydantic==2.12.3",
    "pymupdf==1.26.5",
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "werkzeug==3.1.3",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "httpx==0.28.1",
]

[tool.poetry]
# This is a Flask application, not an installable library, so Poetry
# should only manage the virtual environment/dependencies and not try
# to build/install this project itself.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
